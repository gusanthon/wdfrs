[package]
name = "wdfrs"
version = "0.1.0"
edition = "2021"
readme = "README.md"
license = "MIT"

[lib]
doctest = false

[workspace]
members = [".", "wdf_macros", "cargo-wdffi"]

[features]
default = ["fft", "plot"]
fft = ["dep:realfft"]
plot = ["dep:plotly", "dep:serde_json", "fft"]

[dependencies]
num-traits = "0.2"
rand = "0.10.1"
wdf_macros = { path = "./wdf_macros" }
realfft = { version = "3.3.0", optional = true }
plotly = { version = "0.14.1", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
assert_approx_eq = "1.1.0"

[[example]]
name = "bench"

[[example]]
name = "plot"
required-features = ["plot"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true